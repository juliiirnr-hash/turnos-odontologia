[tool.ruff]
line-length = 120
target-version = "py312"

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "slow: tests requiring external services",
    "integration: integration tests against real Postgres",
]
